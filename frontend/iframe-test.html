<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avatar Iframes</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 32px 16px;
        background: #f5f5f5;
        color: #1a1a1a;
      }
      h1 {
        text-align: center;
        font-size: 24px;
        margin: 0 0 32px;
      }
      h2 {
        font-size: 18px;
        margin: 0 0 12px;
        text-align: center;
        color: #555;
      }
      .block {
        margin: 0 auto 48px;
        width: 90%;
        max-width: 540px;
      }
      .frame {
        width: 100%;
        border: 0;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        background: #000;
        display: block;
      }
      .ratio-16-9 {
        aspect-ratio: 16 / 9;
      }
      .ratio-9-16 {
        aspect-ratio: 9 / 16;
      }
    </style>
  </head>
  <body>
    <h1>Avatar Preview</h1>

    <div class="block">
      <h2>16:9 (Landscape)</h2>
      <iframe
        class="frame ratio-16-9"
        src="https://azap-avatar327d83.netlify.app/"
        allow="microphone; autoplay"
        allowfullscreen
      ></iframe>
    </div>

    <div class="block">
      <h2>9:16 (Portrait)</h2>
      <iframe
        class="frame ratio-9-16"
        src="https://azap-avatar327d83.netlify.app/"
        allow="microphone; autoplay"
        allowfullscreen
      ></iframe>
    </div>
  </body>
</html>
