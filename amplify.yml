version: 1
backend:
  phases:
    build:
      commands:
        # Install root deps (Prisma client lib, etc.) and generate the Prisma
        # client so it bundles into each Lambda.
        - npm ci --cache .npm --prefer-offline
        - npx prisma generate
        # Deploy the Amplify Gen 2 backend (Lambdas + HTTP API Gateway).
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci --cache ../.npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - frontend/node_modules/**/*
