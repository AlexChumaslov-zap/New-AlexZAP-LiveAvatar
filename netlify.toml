[build]
  command = "npm --prefix frontend ci && npm --prefix frontend run build"
  publish = "frontend/dist"

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command    = "npm --prefix frontend run dev"
  targetPort = 5173
  framework  = "vite"

[[redirects]]
  from   = "/api/session/token"
  to     = "/.netlify/functions/session-token"
  status = 200

[[redirects]]
  from   = "/api/health"
  to     = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from   = "/api/log-event"
  to     = "/.netlify/functions/log-event"
  status = 200

[[redirects]]
  from   = "/api/email-transcript"
  to     = "/.netlify/functions/email-transcript"
  status = 200

[[redirects]]
  from   = "/api/visitor"
  to     = "/.netlify/functions/visitor"
  status = 200

[[redirects]]
  from   = "/api/conversation/start"
  to     = "/.netlify/functions/conversation-start"
  status = 200

[[redirects]]
  from   = "/api/conversation/message"
  to     = "/.netlify/functions/conversation-message"
  status = 200

[[redirects]]
  from   = "/api/conversation/end"
  to     = "/.netlify/functions/conversation-end"
  status = 200

# Admin API — Basic Auth applied by the admin-auth edge function.
[[redirects]]
  from   = "/api/admin/conversations"
  to     = "/.netlify/functions/admin-conversations-list"
  status = 200

[[redirects]]
  from   = "/api/admin/conversations/bulk-end"
  to     = "/.netlify/functions/admin-conversations-bulk-end"
  status = 200

[[redirects]]
  from   = "/api/admin/conversations/*/end"
  to     = "/.netlify/functions/admin-conversation-end?id=:splat"
  status = 200

[[redirects]]
  from   = "/api/admin/conversations/*/delete"
  to     = "/.netlify/functions/admin-conversation-delete?id=:splat"
  status = 200

[[redirects]]
  from   = "/api/admin/conversations/*/push-salesforce"
  to     = "/.netlify/functions/admin-conversation-push-salesforce?id=:splat"
  status = 200

[[redirects]]
  from   = "/api/admin/reports/generate"
  to     = "/.netlify/functions/admin-reports-generate"
  status = 200

[[redirects]]
  from   = "/api/admin/conversations/*"
  to     = "/.netlify/functions/admin-conversation-detail?id=:splat"
  status = 200

# SPA fallback: any non-static, non-API path serves index.html so React Router
# can route /admin/* on the client. Order matters — this must come AFTER the
# /api/* rules above so they take precedence.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ──────────────────────────────────────────────────────────────────────────
# Security headers (applied to every response)
# ──────────────────────────────────────────────────────────────────────────
# `frame-ancestors` controls which origins are allowed to embed this site
# in an iframe. We allow self (so the iframe-test page on the same Netlify
# deploy keeps working) plus the production domain zaptest.ai and its subdomains.
# To add another origin later, append it to the directive (e.g. another
# allowed parent site). X-Frame-Options is intentionally NOT set: it can
# only allow ONE specific origin, so it would conflict with the multi-origin
# allow-list. Modern browsers all honor `frame-ancestors`.
#
# TEMPORARY: alexchumaslov-zap.github.io is included for QA testing on a
# GitHub Pages page (the /iframe/ path). Remove this entry once that test
# page is no longer needed.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options    = "nosniff"
    X-DNS-Prefetch-Control    = "on"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    X-Robots-Tag              = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Content-Security-Policy   = "frame-ancestors 'self' https://zaptest.ai https://*.zaptest.ai https://alexchumaslov-zap.github.io;"
    Permissions-Policy        = "microphone=*, camera=(), geolocation=(), payment=(), usb=()"
